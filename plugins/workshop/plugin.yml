schema: 2
id: workshop
version: 0.1.0
host_api: 2
title: Workshop
description: Plugins vibecoded into notes (workshop-plugin@1), and the workshop@1 service that has the claude CLI edit them.
gestalts: [workshop-plugin@1]
worker:
  runtime: uv
  project: worker
  command: [python, -m, workshop_worker]
  services: [workshop@1]
  # the claude CLI it runs talks to Anthropic's API (declared only; the node doesn't enforce it)
  network: [api.anthropic.com:443]
